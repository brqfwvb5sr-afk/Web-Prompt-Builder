<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webbilder – ausführlicher Codex Prompt Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="badge">Webbilder</p>
      <h1>Ausführlichen Website-Prompt für lokale Geschäfte erstellen</h1>
      <p>Trage alle verfügbaren Daten ein. Fehlende Angaben werden im Prompt sauber als „nicht bekannt“ behandelt, damit Codex keine falschen Informationen erfindet.</p>
    </section>

    <section class="grid">
      <form id="promptForm" class="card">
        <h2>1. Geschäftsdaten</h2>
        <label>Name des Geschäfts<input id="businessName" placeholder="z. B. Café Seeblick" required /></label>
        <label>Branche<select id="businessType"><option>Restaurant</option><option>Café</option><option>Coiffeur</option><option>Kosmetikstudio</option><option>Handwerker</option><option>Detailhandel</option><option>Praxis</option><option>Fitness / Sport</option><option>Andere</option></select></label>
        <label>Ort / Region<input id="location" placeholder="z. B. Luzern, Hochdorf, Sursee" /></label>
        <label>Adresse<input id="address" placeholder="Strasse, PLZ Ort" /></label>
        <label>Telefon / WhatsApp<input id="phone" placeholder="+41 ..." /></label>
        <label>E-Mail<input id="email" placeholder="leer lassen, falls nicht gefunden" /></label>
        <label>Aktuelle Website<input id="currentWebsite" placeholder="leer lassen, falls keine Website gefunden" /></label>
        <label>Google-Maps-Link<input id="mapsLink" placeholder="optional" /></label>
        <label>Öffnungszeiten<textarea id="hours" placeholder="Mo–Fr: 08:00–18:00&#10;Sa: 09:00–16:00"></textarea></label>
        <label>Beschreibung / öffentliche Infos<textarea id="description" placeholder="Was macht das Geschäft? Was ist auf Google Maps sichtbar?"></textarea></label>
        <label>Wichtige Notizen für die Website<textarea id="notes" placeholder="z. B. wirkt familiengeführt, alte Website sieht veraltet aus, keine E-Mail gefunden, Speisekarte unklar..."></textarea></label>

        <h2>2. Website-Vorgaben</h2>
        <label>Stil<select id="style"><option>modern, sauber und vertrauenswürdig</option><option>elegant und hochwertig</option><option>warm, lokal und sympathisch</option><option>minimalistisch und professionell</option><option>jung, frisch und auffällig</option></select></label>
        <label>Ziel<select id="goal"><option>mehr Kontaktanfragen</option><option>mehr Reservationen</option><option>mehr Anrufe</option><option>besserer erster Eindruck</option><option>mehr Vertrauen über Google</option></select></label>
        <label>Umfang<select id="size"><option>Kleine Onepager-Website</option><option>Normale Website mit mehreren Sektionen</option><option>Grössere Website mit mehreren Unterseiten</option></select></label>
        <label>Gewünschte Technik<select id="tech"><option>Statisches HTML, CSS und JavaScript</option><option>React mit Vite</option><option>Next.js</option></select></label>
        <label>Repo-Name für Codex<input id="repoName" placeholder="z. B. cafe-seeblick-demo" /></label>
        <label>Deployment<select id="deployment"><option>GitHub Pages</option><option>Vercel</option><option>Netlify</option><option>nur lokale Vorschau</option></select></label>

        <button type="submit">Ausführlichen Prompt erstellen</button>
      </form>

      <section class="card output-card">
        <h2>Generierter Codex-Prompt</h2>
        <textarea id="output" readonly placeholder="Hier erscheint dein ausführlicher Prompt..."></textarea>
        <div class="actions">
          <button id="copyBtn" type="button">Prompt kopieren</button>
          <button id="clearBtn" type="button" class="secondary">Zurücksetzen</button>
        </div>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
